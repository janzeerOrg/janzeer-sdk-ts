name: publish
on:
  release:
    types: [published]
jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Releases are normally published from the maintainer's machine first; skip a version the registry already has,
      # and publish from here only when NPM_TOKEN is set.
      - run: |
          v=$(node -p "require('./package.json').version")
          if npm view "janzeer-sdk@$v" version >/dev/null 2>&1; then echo "janzeer-sdk@$v is already on npm — skipping"; exit 0; fi
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_TOKEN is not set and $v is not on npm — nothing published"; exit 1; fi
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api
      - uses: actions/deploy-pages@v4
